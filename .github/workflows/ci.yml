name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run AST security regression tests
        run: |
          pytest tests/test_security_ast.py -v

      - name: Run offline unit tests
        run: |
          pytest tests/test_canonical_model.py tests/test_chunking.py tests/test_acl.py tests/test_optimization_latency.py -v
