[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arquitetura-rag"
version = "0.1.0"
description = "Arquitetura RAG Multimodal, Híbrida e com ACL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as requiring external services (qdrant, postgres, neo4j)",
    "security: marks security and ACL invariant tests",
]
filterwarnings = [
    "ignore::pytest.PytestReturnNotNoneWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
